apiVersion: apps/v1
kind: Deployment

metadata:
  name: mongo

spec: 
  replicas: 1

  selector:
    matchLabels:
      app: mongo

  template:
    metadata:
      labels:
        app: mongo

    spec:
      containers:
        - name: mongo
          image: mongo:latest

          volumeMounts:
           - name: mongo-data
             mountPath: /data/db          
          ports:
           - containerPort: 27017




      volumes:
        - name: mongo-data
          persistentVolumeClaim:
            claimName: mongo-pvc     
                    