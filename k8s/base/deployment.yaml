
apiVersion: apps/v1
kind: Deployment

metadata: 
  name: task-api

spec: 
  replicas: 3

  selector: 
    matchLabels:
      app: task-api

  template:
    metadata:
      labels:
        app: task-api
      annotations:
        config-version: "2"

    spec: 
      containers: 
        - name: task-api
          image: ai-task-management-system-app:latest
          imagePullPolicy: IfNotPresent
          
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"

          startupProbe:
            httpGet:
              path: /health
              port: 3000
            periodSeconds: 5
            failureThreshold: 12
              

          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            periodSeconds: 10
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            periodSeconds: 5
            failureThreshold: 3            


          ports: 
           - containerPort: 3000

          env: 
           - name: NODE_ENV 
             valueFrom: 
              configMapKeyRef:
                name: task-api-config
                key: NODE_ENV

           - name: PORT
             valueFrom:
              configMapKeyRef:
                name: task-api-config
                key: PORT  

           - name: LOG_LEVEL
             valueFrom:
              configMapKeyRef:
                name: task-api-config 
                key: LOG_LEVEL

           - name: MONGO_URI
             valueFrom:
              secretKeyRef:
                name: task-api-secret
                key: MONGO_URI       
