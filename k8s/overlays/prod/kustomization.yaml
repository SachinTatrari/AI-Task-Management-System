apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base


patches:
  - target:
      kind: ConfigMap
      name: task-api-config
    patch: |-
     - op: replace
       path: /data/NODE_ENV
       value: Production

secretGenerator:
  - name: task-api-secret
    envs:
      - .env.secret      