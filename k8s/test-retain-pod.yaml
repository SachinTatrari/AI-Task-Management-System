apiVersion: v1
kind: Pod

metadata:
  name: test-retain-pod

spec:
  containers:
    - name: test
      image: busybox
      command: ["sleep", "3600"]

      volumeMounts:
        - name: retain-storage
          mountPath: /data

  volumes:
    - name: retain-storage
      persistentVolumeClaim:
        claimName: test-retain-pvc